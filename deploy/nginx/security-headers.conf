# Security headers for task.mico360.com — included at server level AND in every location that
# sets its own add_header (nginx drops inherited add_header directives in such locations).
# Install next to the site config, e.g. /etc/nginx/snippets/mico360-security-headers.conf.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The SPA loads only its own scripts; styles allow the inline first-paint block in index.html and
# Google Fonts; realtime uses a same-origin WebSocket.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' wss://task.mico360.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
