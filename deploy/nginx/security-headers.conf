# Security headers for task.mico360.com — included at server level AND in every location that
# sets its own add_header (nginx drops inherited add_header directives in such locations).
# Install next to the site config, e.g. /etc/nginx/snippets/mico360-security-headers.conf.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# "strict-origin-when-cross-origin", and "no-referrer" on client pages (/client/<link>): the
# $mico360_referrer map in the site config (task.mico360.com.conf) decides.
add_header Referrer-Policy $mico360_referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# The SPA loads only its own scripts; styles allow the inline first-paint block in index.html and
# Google Fonts; realtime uses a same-origin WebSocket. What it blocks is reported to the server's
# Error log (1.22.4): report-uri for Firefox and Safari, report-to (the two headers below) for
# Chrome and Edge. Kept the same as lib/web-app.ts (lib/deploy-headers.test.ts checks it).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' wss://task.mico360.com; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; report-uri /api/v1/client-errors/csp; report-to mico360-csp" always;
add_header Reporting-Endpoints 'mico360-csp="https://task.mico360.com/api/v1/client-errors/csp"' always;
add_header Report-To '{"group":"mico360-csp","max_age":10886400,"endpoints":[{"url":"https://task.mico360.com/api/v1/client-errors/csp"}]}' always;
