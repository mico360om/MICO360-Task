# MICO360 Tasks — nginx site for task.mico360.com
# Serves the built web app AND proxies the API/realtime/uploads to the backend on one domain,
# so the frontend calls the API same-origin (VITE_API_URL=/api/v1). Install to
# /etc/nginx/sites-available/task.mico360.com and symlink into sites-enabled.

# ── HTTP: ACME challenge + redirect everything else to HTTPS ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name task.mico360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # certbot --webroot writes challenges here
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: the app ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name task.mico360.com;

    ssl_certificate     /etc/letsencrypt/live/task.mico360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/task.mico360.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;   # certbot's recommended TLS params
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Built frontend: copy Web Portal/frontend/dist here on each deploy.
    root /var/www/task.mico360.com;
    index index.html;

    # Allow ~10 MiB uploads (UPLOAD_MAX_BYTES=10485760) plus multipart overhead.
    client_max_body_size 12m;

    # Long-cache the fingerprinted assets Vite emits; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API → backend (Fastify on :4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded attachment/avatar files → backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO realtime (WebSocket upgrade) → backend
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # SPA fallback: client-side routes resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
