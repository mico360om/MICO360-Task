# MICO360 Tasks — nginx site for task.mico360.com
# Serves the built web app AND proxies the API/realtime/uploads to the backend on one domain,
# so the frontend calls the API same-origin (VITE_API_URL=/api/v1). Install to
# /etc/nginx/sites-available/task.mico360.com, copy security-headers.conf to
# /etc/nginx/snippets/mico360-security-headers.conf, and symlink the site into sites-enabled.
#
# The backend must trust this proxy for the client IP: TRUST_PROXY=loopback (the default).

# ── HTTP: ACME challenge + redirect everything else to HTTPS ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name task.mico360.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # certbot --webroot writes challenges here
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: the app ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name task.mico360.com;

    ssl_certificate     /etc/letsencrypt/live/task.mico360.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/task.mico360.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:mico360_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/mico360-security-headers.conf;

    # Compress text responses (JS/CSS bundles, JSON API responses, SVG).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Built frontend: copy Web Portal/frontend/dist here on each deploy. Keep the previous
    # release's /assets files for a while so tabs still open on the old version can load them.
    root /var/www/task.mico360.com;
    index index.html;

    # Allow ~10 MiB uploads (UPLOAD_MAX_BYTES=10485760) plus multipart overhead.
    client_max_body_size 12m;

    # index.html must always be revalidated, or browsers keep asking for old bundle hashes after
    # a deploy. The SPA fallback below also lands here.
    location = /index.html {
        include /etc/nginx/snippets/mico360-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Long-cache the fingerprinted assets Vite emits.
    location /assets/ {
        include /etc/nginx/snippets/mico360-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Android App Links verification file (password-reset links open the app).
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # REST API → backend (Fastify on :4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded attachment/avatar files → backend (which adds nosniff, a sandboxing CSP and
    # Content-Disposition: attachment for anything that isn't an image).
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Brand images referenced by outgoing emails (logo) → backend.
    location /email-assets/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO realtime (WebSocket upgrade) → backend
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep long-lived sockets open
    }

    # SPA fallback: client-side routes resolve to index.html (served by the no-cache block above).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
