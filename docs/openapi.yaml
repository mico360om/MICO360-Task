openapi: 3.0.3
info:
  title: MICO360 Tasks API
  version: 1.0.0
  description: >-
    REST API for MICO360 Tasks (web app, Chrome extension, and the Phase 2 Android
    app). All responses use a JSON envelope: success is `{ "data": ... }`, errors
    are `{ "error": { "code": string, "message": string, "details"?: any } }`.
    Authenticate by sending `Authorization: Bearer <accessToken>`.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: https://task.mico360.com/api/v1
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: INVALID_CREDENTIALS }
            message: { type: string }
            details: {}
    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        refreshToken: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        roles: { type: array, items: { type: string, enum: [ADMIN, EMPLOYEE] } }
    Task:
      type: object
      properties:
        id: { type: string }
        key: { type: string, example: MICO-142 }
        title: { type: string }
        description: { type: string, nullable: true }
        projectId: { type: string }
        columnId: { type: string }
        position: { type: integer }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        dueDate: { type: string, format: date-time, nullable: true }
        progress: { type: integer }
        recurrenceRule:
          nullable: true
          description: The repeat rule. Only the newest copy of a recurring series carries it.
          $ref: '#/components/schemas/RecurrenceRule'
        recurrenceParentId:
          type: string
          nullable: true
          description: Set on every copy of a recurring series (the first task's id; the first task links to itself once it has a copy).
        recurrenceNextId:
          type: string
          nullable: true
          description: >
            GET /tasks/{id} only. The copy made from this task. Set means this is an earlier copy: setting
            a repeat on it is refused with 409 RECURRENCE_NOT_NEWEST (it would start a second series).
        meetingId:
          type: string
          nullable: true
          description: The meeting this task was created from (a Live note made into a task); its next repeat copies keep it.
        meeting:
          type: object
          nullable: true
          description: >
            GET /tasks/{id} only. The meeting the task was created from, as the caller may see it; null when
            there is none or it was deleted. For someone who may not see the meeting, title and startAt are
            null and canView is false.
          properties:
            id: { type: string }
            title: { type: string, nullable: true }
            startAt: { type: string, format: date-time, nullable: true }
            canView: { type: boolean }
    RecurrenceRule:
      type: object
      description: >
        A task's repeat schedule. When the next copy is made it keeps the title, description,
        priority, estimate, assignees, watchers, tags and checklist (unticked), lands in the
        project's first open column, and takes over the rule. A task never gets two next copies
        (enforced by the database), so completing it twice, or from several apps at once, makes one.
      required: [freq, interval]
      properties:
        freq: { type: string, enum: [DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY] }
        interval: { type: integer, minimum: 1, description: 'Every N days / weeks / months / quarters / years.' }
        count: { type: integer, nullable: true, description: 'End after this many tasks in the series.' }
        until: { type: string, nullable: true, description: 'Last date (YYYY-MM-DD) a copy may be due.' }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 'WEEKLY: the days (0 = Sunday).' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, description: 'MONTHLY / QUARTERLY: the day (31 = the last day of each month).' }
        nthWeekday:
          type: object
          description: 'MONTHLY / QUARTERLY, instead of dayOfMonth: "the 2nd Tuesday" or "the last Friday".'
          properties:
            week: { type: integer, enum: [1, 2, 3, 4, -1], description: '-1 = the last one of the month.' }
            day: { type: integer, minimum: 0, maximum: 6 }
        createNext:
          type: string
          enum: [ON_COMPLETE, ON_SCHEDULE]
          description: >
            ON_COMPLETE (default): the next copy is made when this one is completed, dated by the
            rule and never already overdue (missed dates are skipped). ON_SCHEDULE: a copy is made
            on each due date whether or not the previous one is done (an hourly server job; missed
            days collapse into one copy).
        paused: { type: boolean, description: 'No new copies while paused.' }
    Project:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        carryForward:
          type: boolean
          description: >
            Each night, unfinished tasks on past board days move to today's board (default true). The
            company-wide setting carryForward.enabled comes first: when it is off, nothing carries.
            Optional on create and update (admin); left out of an update, it stays as it is.
        defaultDueToday:
          type: boolean
          description: >
            Default false. When true, a task created in the project without a due date gets one: the
            board day it is created on (the task's boardDate) when that day is later than today, else
            today, the company's calendar day (a past board day also gives today). It is stored like
            any due date (UTC midnight of that day). A due date that is sent is always kept. A task
            sent with a start date later than that day and no due date stays undated. Clearing the due
            date later leaves it clear. Optional on create and update (admin); left out of an update,
            it stays as it is.
  responses:
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      security: []
      summary: Liveness probe (status + uptime)
      responses:
        '200': { description: OK }
  /metrics:
    get:
      summary: Process metrics (uptime, memory) — administrators only
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
  /config:
    get:
      security: []
      summary: Public client settings — company time zone, product name, whether email is set up, the Android app download link (androidAppUrl, may be null) and the server time
      responses:
        '200': { description: OK }

  /auth/login:
    post:
      security: []
      summary: Log in with email-or-username + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: email or username }
                password: { type: string }
      responses:
        '200':
          description: Session issued
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Session' } } } } }
        '401': { description: Invalid credentials }
        '423': { description: Account locked (5 failed attempts) — reset password to unlock }
  /auth/otp/request:
    post:
      security: []
      summary: Request a passwordless email login code
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string } } } } }
      responses: { '200': { description: A code is emailed if the account exists } }
  /auth/otp/verify:
    post:
      security: []
      summary: Verify an email login code
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier, code], properties: { identifier: { type: string }, code: { type: string } } } } }
      responses: { '200': { description: Session issued }, '401': { description: Invalid/expired code } }
  /auth/password/forgot:
    post:
      security: []
      summary: Request a password-reset link (never reveals account existence)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string } } } } }
      responses: { '200': { description: '{ sent: true }' } }
  /auth/password/reset:
    post:
      security: []
      summary: Reset a password with a token (also unlocks the account)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } } } }
      responses: { '200': { description: '{ reset: true }' }, '400': { description: Invalid token / weak password } }
  /auth/refresh:
    post:
      security: []
      summary: Exchange a refresh token for a new session (the token is rotated)
      description: >
        Each refresh token works once. If the reply was lost, presenting the same token again within
        2 minutes returns the same new refresh token (with a fresh access token) while that one is
        unused; later, or once it was used, it is treated as theft and the whole sign-in is ended.
        A fingerprint sign-in key is refused here.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses: { '200': { description: Session issued }, '401': { description: Invalid, expired, or already used } }
  /auth/biometric-credential:
    post:
      security: []
      summary: A fingerprint sign-in key for this phone, made with its session's refresh token
      description: >
        A refresh token marked for fingerprint sign-in, in a rotation family of its own. It never
        refreshes a session; it only signs in through /auth/biometric-sign-in, which doesn't spend it.
        The session's refresh token is checked, not spent (an access token alone can't make a key).
        It lasts 30 days from the person's last sign-in or refresh. A password change, an admin
        reset, or a stolen session caught being reused revokes it. `keyId` cancels it (below).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses: { '201': { description: '{ refreshToken (the key), keyId }' }, '401': { description: 'INVALID_REFRESH_TOKEN: the session ended' } }
  /auth/biometric-credential/revoke:
    post:
      security: []
      summary: Cancel one of the person's fingerprint keys (turned off on the phone, or replaced)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken, keyId], properties: { refreshToken: { type: string }, keyId: { type: string, pattern: '^[0-9a-f]{64}$' } } }
      responses: { '200': { description: '{ ok: true } (also when the key had already ended)' }, '401': { description: 'INVALID_REFRESH_TOKEN: the session ended' } }
  /auth/biometric-sign-in:
    post:
      security: []
      summary: Sign in with a phone's fingerprint sign-in key (the key is not spent)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [credential], properties: { credential: { type: string } } } } }
      responses: { '200': { description: Session issued }, '401': { description: 'INVALID_BIOMETRIC_KEY: revoked, expired or not a fingerprint key' } }

  /projects:
    get:
      summary: List projects
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      summary: Create a project (admin)
      responses: { '201': { description: Created }, '403': { description: Forbidden } }
  /projects/{id}/columns:
    get:
      summary: List a project's Kanban columns
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }

  /tasks:
    get:
      summary: List tasks (optionally filtered by projectId/columnId)
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: columnId, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      summary: Create a task
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
      responses: { '201': { description: Created } }
  /tasks/mine:
    get:
      summary: Tasks assigned to the current user
      responses: { '200': { description: OK } }
  /tasks/{id}:
    get:
      summary: Get a task
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: Not found } }
    put:
      summary: Update a task
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }
    delete:
      summary: Delete a task (admin)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: Deleted } }
  /tasks/{id}/move:
    patch:
      summary: Move a task to a column (Kanban drag-drop persistence)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [columnId], properties: { columnId: { type: string }, position: { type: integer } } } } }
      responses: { '200': { description: OK } }
  /tasks/{id}/assignees:
    get: { summary: List assignees, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post:
      summary: Assign users (many-to-many)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [userIds], properties: { userIds: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: OK } }
  /tasks/{id}/assignees/swap:
    post:
      summary: >-
        Hand the task from one person to another in one write (the Workload page's suggestion) — the
        same view check and assignee rules as adding someone, with the usual notifications and activity.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string }, expectedVersion: { type: integer } } } } } }
      responses:
        '200': { description: The task's assignees now }
        '400': { description: '`to` may not be assigned in the task''s project' }
        '403': { description: Not allowed to see the task }
        '409': { description: 'VERSION_CONFLICT (changed since expectedVersion), TASK_DONE, or ASSIGNEE_GONE (`from` is no longer on it)' }
  /tasks/{id}/checklist:
    get: { summary: List checklist items, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post: { summary: Add a checklist item, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '201': { description: Created } } }
  /tasks/{id}/comments:
    get: { summary: List comments, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post: { summary: Add a comment (supports @mentions), parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '201': { description: Created } } }
  /tasks/{id}/attachments:
    get: { summary: List attachments, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post:
      summary: Upload an attachment (multipart)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: Created }, '400': { description: Too large / disallowed / spoofed type } }
  /tasks/{id}/export.xlsx:
    get:
      summary: >-
        One task as an Excel workbook (Task, Checklist, Comments, Attachments, Dependencies, Activity).
        /tasks/{id}/export.pdf gives it as a branded PDF. Anyone who can open the task may export it.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 'File download named after the task, e.g. MICO-12-inspect-the-rig.xlsx' }
        '404': { description: No such task, or not visible to you }
  /tasks/{id}/dependencies:
    get: { summary: List blocked-by / blocks, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post:
      summary: Add a dependency (server rejects cycles)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [dependsOnTaskId], properties: { dependsOnTaskId: { type: string } } } } } }
      responses: { '201': { description: Created }, '409': { description: DEPENDENCY_CYCLE / DEPENDENCY_EXISTS } }

  /timeline:
    get:
      summary: >-
        The Timeline page — every open project (not Completed or Archived) the caller may see, exactly
        as the projects list decides, with its bar, status against its dates, milestones, meetings and
        the open tasks due each week. One request, answered by a fixed number of grouped queries.
      description: >-
        Days are company-time calendar days. `from` / `to` are widened to whole weeks starting on
        `weekStart`. Each project: `start` (its start date, else the day it was created —
        `startIsCreated`), `target` (or null), `tasks` { total, done, open, overdue }, `progress`
        (share done, rounded as on the Projects page: 99 until every task is done), `timeUsed` (share
        of the days from start to target gone, 0–100; null without a target), `health` — `late`
        (target day passed; `daysLate`), `at-risk` (timeUsed − progress ≥ 20), `on-track` or
        `no-target` — `dueByWeek` (open tasks due in each of `weeks`), `milestones` due in the shown
        weeks [{ id, key, title, date, done }] by date, `nextMilestone` (the earliest not reached, else
        an undated one), `milestoneCount`, `milestonesSoon` (not reached, due from today to 30 days on),
        `meetings` in the shown weeks [{ id, title, startAt, day }] (not cancelled) and
        `meetingsThisWeek`. No read is capped. `from` and `to` must be within two years of today.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: weekStart, in: query, schema: { type: integer, enum: [0, 1, 6], default: 0 }, description: 'First day of the week: 0 Sunday, 1 Monday, 6 Saturday' }
      responses:
        '200':
          description: >-
            `{ data: { from, to, weekStart, today, currentWeek, weeks: [date], projects: [TimelineProject] } }`
            — each project also carries id, code, name, color, icon, imageUrl, status and owner { id, name, avatarUrl }.
        '400': { description: 'VALIDATION: a missing or unreal date, a date more than two years from today, an unknown week start, `to` before `from`, or more than 53 weeks' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /workload:
    get:
      summary: >-
        The Workload page — open tasks due each day of a week, per person, against the company's daily
        limit (system setting `workload.dailyLimit`, 1–50, default 5; administrators change it with
        PUT /system-settings/workload.dailyLimit). An administrator sees everyone; a project manager
        (the project's manager or owner, or a MANAGER member) the people on the projects they manage
        and only those projects' tasks (their own row: all their own tasks in the projects they can see);
        anyone else only their own row. Completed and archived projects are left out.
      description: >-
        Days off come from the company's working hours (`meetings.workingHours`): on a day off the
        limit is 0. For each day over the limit, as many tasks as it is over carry one `suggestion`:
        `{ kind: reassign, to: { id, name }, count }` — the least-busy person on the task's project team
        (active, shown to the caller, not already on the task) with room that day; `count` is their
        number that day for an administrator only (null for anyone else) — or `{ kind: move, date }`,
        the next working day (today or later, within three weeks) with room for everyone on the task.
        Teammates and days are weighed by everyone's whole load (every live project, also people the
        caller can't see, whose figures are never sent), and each suggestion counts towards the next.
        Only administrators and project managers get reassign suggestions. Nothing is changed: the page
        applies a suggestion with POST /tasks/{id}/assignees/swap or PUT /tasks/{id} (with expectedVersion).
      parameters:
        - { name: week, in: query, required: true, schema: { type: string, format: date }, description: The first of the seven days shown }
        - { name: projectId, in: query, schema: { type: string }, description: 'Only this project''s tasks, and its team and whoever has its tasks (ignored when not in the caller''s scope)' }
      responses:
        '200':
          description: >-
            `{ data: { week, today, days: [{ date, working }], limit, canChangeLimit, scope: everyone|teams|self,
            projectId, projects: [{ id, code, name, color, icon, imageUrl }], people: [{ id, name, avatarUrl, me,
            overdue, total, weekLimit, days: [{ date, count, limit, over, tasks: [{ id, key, title, projectId,
            priority, version, suggestion }] }] }] } }` — in a day's tasks the suggested ones come first.
        '400': { description: 'VALIDATION: a missing or unreal week, or one more than two years from today' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search:
    get:
      summary: Global search across tasks / projects / users
      parameters: [ { name: q, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK } }
  /notifications:
    get: { summary: Current user's notifications, responses: { '200': { description: OK } } }
  /notifications/unread-count:
    get: { summary: Unread notification count, responses: { '200': { description: OK } } }
  /reports/projects:
    get:
      summary: Project performance report (admin). Also /reports/status, /reports/workload, /reports/completion.
      parameters:
        - { name: projectId, in: query, schema: { type: string }, description: Only this project }
        - { name: userId, in: query, schema: { type: string }, description: Only tasks assigned to this team member }
      responses: { '200': { description: OK }, '403': { description: Forbidden } }
  /reports/projects.csv:
    get:
      summary: >-
        Project performance as a download (admin) — .xlsx (formatted Excel workbook), .pdf (branded
        report with logo, sections, tables and page numbers), .csv, or .xls (older SpreadsheetML, kept
        for old links). The same suffixes exist for /reports/status, /reports/workload and
        /reports/timeseries (which also takes from / to).
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
      responses:
        '200':
          description: >-
            File download. Content-Disposition names it report + filters + the company day, e.g.
            project-performance-rig-inspection-portal-2026-10-01.csv (exposed to cross-origin callers).
        '403': { description: Forbidden }
  /reports/export.xlsx:
    get:
      summary: >-
        The full report (admin) as one Excel workbook — a sheet per section (Summary, Status, Projects,
        Team workload, Trend, Tasks) with titles, the filters used, frozen bold headers and sized
        columns. /reports/export.pdf gives the same report as a branded landscape PDF.
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Trend period start (default 30 days before `to`) }
        - { name: to, in: query, schema: { type: string, format: date }, description: Trend period end (default the company's today) }
        - { name: sections, in: query, schema: { type: string, example: 'summary,tasks' }, description: 'Comma-separated subset of summary, status, projects, workload, trend, tasks (default all)' }
      responses:
        '200': { description: 'File download, e.g. tasks-report-mico360-platform-2026-10-01.xlsx' }
        '400': { description: Unknown section, or from after to }
        '403': { description: Forbidden }
  /users/me/export:
    get:
      summary: Download my data — everything held about the signed-in person, as a JSON file (recorded in the audit log)
      responses:
        '200': { description: JSON file (Content-Disposition attachment) }
        '401': { description: Not signed in }
  /meetings/{id}/notes/{noteId}/restore:
    post:
      summary: Undo a meeting-note delete (notes are soft-deleted). The note's author or the meeting's organizer only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: noteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The restored note }
        '403': { description: Not the author or organizer }
        '404': { description: No deleted note with that id in this meeting }
