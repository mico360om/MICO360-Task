openapi: 3.0.3
info:
  title: MICO360 Tasks API
  version: 1.0.0
  description: >-
    REST API for MICO360 Tasks (web app, Chrome extension, and the Phase 2 Android
    app). All responses use a JSON envelope: success is `{ "data": ... }`, errors
    are `{ "error": { "code": string, "message": string, "details"?: any } }`.
    Authenticate by sending `Authorization: Bearer <accessToken>`.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: https://task.mico360.com/api/v1
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: INVALID_CREDENTIALS }
            message: { type: string }
            details: {}
    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        refreshToken: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        roles: { type: array, items: { type: string, enum: [ADMIN, EMPLOYEE] } }
    Task:
      type: object
      properties:
        id: { type: string }
        key: { type: string, example: MICO-142 }
        title: { type: string }
        description: { type: string, nullable: true }
        projectId: { type: string }
        columnId: { type: string }
        position: { type: integer }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        dueDate: { type: string, format: date-time, nullable: true }
        progress: { type: integer }
        recurrenceRule:
          nullable: true
          description: The repeat rule. Only the newest copy of a recurring series carries it.
          $ref: '#/components/schemas/RecurrenceRule'
        recurrenceParentId:
          type: string
          nullable: true
          description: Set on every copy of a recurring series (the first task's id; the first task links to itself once it has a copy).
        recurrenceNextId:
          type: string
          nullable: true
          description: >
            GET /tasks/{id} only. The copy made from this task. Set means this is an earlier copy: setting
            a repeat on it is refused with 409 RECURRENCE_NOT_NEWEST (it would start a second series).
        meetingId:
          type: string
          nullable: true
          description: The meeting this task was created from (a Live note made into a task); its next repeat copies keep it.
        formerKeys:
          type: array
          items: { type: string }
          example: [RIG-4]
          description: >
            GET /tasks/{id} only. Keys the task had before it moved to another project, oldest first.
            Each still finds it (search, "open RIG-4"), and no other task is ever given one of them.
        meeting:
          type: object
          nullable: true
          description: >
            GET /tasks/{id} only. The meeting the task was created from, as the caller may see it; null when
            there is none or it was deleted. For someone who may not see the meeting, title and startAt are
            null and canView is false.
          properties:
            id: { type: string }
            title: { type: string, nullable: true }
            startAt: { type: string, format: date-time, nullable: true }
            canView: { type: boolean }
    RecurrenceRule:
      type: object
      description: >
        A task's repeat schedule. When the next copy is made it keeps the title, description,
        priority, estimate, assignees, watchers, tags and checklist (unticked), lands in the
        project's first open column, and takes over the rule. A task never gets two next copies
        (enforced by the database), so completing it twice, or from several apps at once, makes one.
      required: [freq, interval]
      properties:
        freq: { type: string, enum: [DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY] }
        interval: { type: integer, minimum: 1, description: 'Every N days / weeks / months / quarters / years.' }
        count: { type: integer, nullable: true, description: 'End after this many tasks in the series.' }
        until: { type: string, nullable: true, description: 'Last date (YYYY-MM-DD) a copy may be due.' }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 'WEEKLY: the days (0 = Sunday).' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, description: 'MONTHLY / QUARTERLY: the day (31 = the last day of each month).' }
        nthWeekday:
          type: object
          description: 'MONTHLY / QUARTERLY, instead of dayOfMonth: "the 2nd Tuesday" or "the last Friday".'
          properties:
            week: { type: integer, enum: [1, 2, 3, 4, -1], description: '-1 = the last one of the month.' }
            day: { type: integer, minimum: 0, maximum: 6 }
        createNext:
          type: string
          enum: [ON_COMPLETE, ON_SCHEDULE]
          description: >
            ON_COMPLETE (default): the next copy is made when this one is completed, dated by the
            rule and never already overdue (missed dates are skipped). ON_SCHEDULE: a copy is made
            on each due date whether or not the previous one is done (an hourly server job; missed
            days collapse into one copy).
        paused: { type: boolean, description: 'No new copies while paused.' }
    Project:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        carryForward:
          type: boolean
          description: >
            Each night, unfinished tasks on past board days move to today's board (default true). The
            company-wide setting carryForward.enabled comes first: when it is off, nothing carries.
            Optional on create and update (admin); left out of an update, it stays as it is.
        defaultDueToday:
          type: boolean
          description: >
            Default false. When true, a task created in the project (or moved into it) without a due date gets one: the
            board day it is created on (the task's boardDate) when that day is later than today, else
            today, the company's calendar day (a past board day also gives today). It is stored like
            any due date (UTC midnight of that day). A due date that is sent is always kept. A task
            sent with a start date later than that day and no due date stays undated. Clearing the due
            date later leaves it clear. Optional on create and update (admin); left out of an update,
            it stays as it is.
    MovePerson:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Sara Al Balushi }
    MoveProject:
      type: object
      properties:
        id: { type: string }
        code: { type: string, example: OPS }
        name: { type: string, example: Operations }
        status: { type: string, enum: [PLANNING, ACTIVE, ON_HOLD] }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
    MoveTargets:
      type: object
      description: Where the caller may move tasks to, and whose tasks they may move.
      properties:
        managesAll: { type: boolean, description: 'An administrator: any task, to any open project.' }
        managedProjectIds:
          type: array
          items: { type: string }
          description: "The projects the caller manages (its owner, its named manager or a MANAGER member), whatever their status. Their tasks may be moved out. Empty for an administrator."
        projects:
          type: array
          items: { $ref: '#/components/schemas/MoveProject' }
          description: Open projects (not completed or archived) the caller may move tasks into, by name.
    MoveInput:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string, description: The project to move the task to. }
        columnId:
          type: string
          description: >
            A column of that project. Left out, each task goes to the project's first column of the same
            kind (status category) as the one it is in now, or its first column when it has none of that kind
            (columns switched off in Manage columns are used only when there is no other).
        assignees:
          type: string
          enum: [ADD_TO_TEAM, UNASSIGN]
          description: >
            What happens to people assigned to the task who aren't on the new project's team (its owner,
            manager, creator, members, and administrators): added to the team as members, or taken off the
            task. Required when there are such people: without it the move is refused with 409
            ASSIGNEES_NOT_ON_TEAM, naming them in error.details.people.
    TaskMovePreview:
      type: object
      properties:
        id: { type: string }
        key: { type: string, description: 'Its key now (empty for a task that is not found).' }
        title: { type: string }
        from: { type: object, nullable: true, properties: { id: { type: string }, code: { type: string }, name: { type: string } } }
        canMove: { type: boolean }
        reason: { type: string, nullable: true, example: You need to manage Admin to move its tasks. }
        newKey: { type: string, nullable: true, example: OPS-17, description: 'The key it would get: the next number now, in order for several tasks. A task created there at the same moment can take it; the move then takes the next.' }
        currentCategory: { type: string, nullable: true, description: The status category of the column it is in now. }
        completed: { type: boolean, description: 'It is completed now: moved to an open column it is re-opened; an open task moved to a Done column is completed.' }
        columnId: { type: string, nullable: true, description: 'Where it goes unless another column is chosen.' }
        milestoneCleared: { type: boolean, description: 'It is a milestone: moving clears it (milestones belong to their project).' }
        dueDate: { type: string, nullable: true, example: '2026-10-24', description: "The due day it gets from the new project's \"New tasks are due today\" (it has none now)." }
        repeat:
          type: string
          nullable: true
          enum: [SERIES, COPY]
          description: 'SERIES: the newest copy of a repeating task; its next copies are made in the new project. COPY: an earlier copy, which moves alone.'
        outsiders: { type: array, items: { $ref: '#/components/schemas/MovePerson' }, description: People assigned to it who aren't on the new team. }
    MovePreview:
      type: object
      properties:
        project: { allOf: [{ $ref: '#/components/schemas/MoveProject' }, { type: object, properties: { defaultDueToday: { type: boolean } } }] }
        columns:
          type: array
          description: The new project's switched-on columns, in board order.
          items: { type: object, properties: { id: { type: string }, name: { type: string }, category: { type: string }, position: { type: integer }, enabled: { type: boolean } } }
        tasks: { type: array, items: { $ref: '#/components/schemas/TaskMovePreview' }, description: 'One per task asked about, in that order.' }
        outsiders: { type: array, items: { $ref: '#/components/schemas/MovePerson' }, description: 'Everyone not on the new team across the tasks that can move, once each.' }
    MoveResult:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Task' }
        from: { type: object, properties: { projectId: { type: string }, name: { type: string }, key: { type: string, example: RIG-4 } } }
        to: { type: object, properties: { projectId: { type: string }, name: { type: string }, key: { type: string, example: OPS-17 } } }
        addedToTeam: { type: array, items: { $ref: '#/components/schemas/MovePerson' } }
        unassigned: { type: array, items: { $ref: '#/components/schemas/MovePerson' } }
        milestoneCleared: { type: boolean }
        dueDateSet: { type: string, nullable: true, example: '2026-10-24' }
        statusChange: { type: string, nullable: true, enum: [COMPLETED, REOPENED], description: 'The move completed the task (into a Done column) or re-opened it (out of one).' }
    BulkMoveResult:
      type: object
      properties:
        results:
          type: array
          description: One per task asked for, in that order. A refused task never hides the others' success.
          items:
            oneOf:
              - allOf: [{ type: object, properties: { taskId: { type: string }, ok: { type: boolean, enum: [true] } } }, { $ref: '#/components/schemas/MoveResult' }]
              - type: object
                properties:
                  taskId: { type: string }
                  ok: { type: boolean, enum: [false] }
                  error: { type: object, properties: { code: { type: string, example: ASSIGNEES_NOT_ON_TEAM }, message: { type: string }, details: {} } }
        moved: { type: integer }
        failed: { type: integer }
  responses:
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      security: []
      summary: Liveness probe (status + uptime)
      responses:
        '200': { description: OK }
  /metrics:
    get:
      summary: Process metrics (uptime, memory) — administrators only
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
  /config:
    get:
      security: []
      summary: Public client settings — company time zone, product name, whether email is set up, the Android app download link (androidAppUrl, may be null) and the server time
      responses:
        '200': { description: OK }

  /auth/login:
    post:
      security: []
      summary: Log in with email-or-username + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: email or username }
                password: { type: string }
      responses:
        '200':
          description: Session issued
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Session' } } } } }
        '401': { description: Invalid credentials }
        '423': { description: Account locked (5 failed attempts) — reset password to unlock }
  /auth/otp/request:
    post:
      security: []
      summary: Request a passwordless email login code
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string } } } } }
      responses: { '200': { description: A code is emailed if the account exists } }
  /auth/otp/verify:
    post:
      security: []
      summary: Verify an email login code
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier, code], properties: { identifier: { type: string }, code: { type: string } } } } }
      responses: { '200': { description: Session issued }, '401': { description: Invalid/expired code } }
  /auth/password/forgot:
    post:
      security: []
      summary: Request a password-reset link (never reveals account existence)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string } } } } }
      responses: { '200': { description: '{ sent: true }' } }
  /auth/password/reset:
    post:
      security: []
      summary: Reset a password with a token (also unlocks the account)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } } } }
      responses: { '200': { description: '{ reset: true }' }, '400': { description: Invalid token / weak password } }
  /auth/refresh:
    post:
      security: []
      summary: Exchange a refresh token for a new session (the token is rotated)
      description: >
        Each refresh token works once. If the reply was lost, presenting the same token again within
        2 minutes returns the same new refresh token (with a fresh access token) while that one is
        unused; later, or once it was used, it is treated as theft and the whole sign-in is ended.
        A fingerprint sign-in key is refused here.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses: { '200': { description: Session issued }, '401': { description: Invalid, expired, or already used } }
  /auth/biometric-credential:
    post:
      security: []
      summary: A fingerprint sign-in key for this phone, made with its session's refresh token
      description: >
        A refresh token marked for fingerprint sign-in, in a rotation family of its own. It never
        refreshes a session; it only signs in through /auth/biometric-sign-in, which doesn't spend it.
        The session's refresh token is checked, not spent (an access token alone can't make a key).
        It lasts 30 days from the person's last sign-in or refresh. A password change, an admin
        reset, or a stolen session caught being reused revokes it. `keyId` cancels it (below).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses: { '201': { description: '{ refreshToken (the key), keyId }' }, '401': { description: 'INVALID_REFRESH_TOKEN: the session ended' } }
  /auth/biometric-credential/revoke:
    post:
      security: []
      summary: Cancel one of the person's fingerprint keys (turned off on the phone, or replaced)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken, keyId], properties: { refreshToken: { type: string }, keyId: { type: string, pattern: '^[0-9a-f]{64}$' } } }
      responses: { '200': { description: '{ ok: true } (also when the key had already ended)' }, '401': { description: 'INVALID_REFRESH_TOKEN: the session ended' } }
  /auth/biometric-sign-in:
    post:
      security: []
      summary: Sign in with a phone's fingerprint sign-in key (the key is not spent)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [credential], properties: { credential: { type: string } } } } }
      responses: { '200': { description: Session issued }, '401': { description: 'INVALID_BIOMETRIC_KEY: revoked, expired or not a fingerprint key' } }

  /projects:
    get:
      summary: List projects
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      summary: Create a project (admin)
      responses: { '201': { description: Created }, '403': { description: Forbidden } }
  /projects/{id}/columns:
    get:
      summary: List a project's Kanban columns
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }

  /tasks:
    get:
      summary: List tasks (optionally filtered by projectId/columnId)
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: columnId, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      summary: Create a task
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
      responses: { '201': { description: Created } }
  /tasks/mine:
    get:
      summary: Tasks assigned to the current user
      responses: { '200': { description: OK } }
  /tasks/{id}:
    get:
      summary: Get a task
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: Not found } }
    put:
      summary: Update a task
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }
    delete:
      summary: Delete a task (admin)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: Deleted } }
  /tasks/{id}/move:
    patch:
      summary: Move a task to a column (Kanban drag-drop persistence)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [columnId], properties: { columnId: { type: string }, position: { type: integer } } } } }
      responses: { '200': { description: OK } }
  /tasks/{id}/assignees:
    get: { summary: List assignees, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post:
      summary: Assign users (many-to-many)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [userIds], properties: { userIds: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: OK } }
  /tasks/{id}/checklist:
    get: { summary: List checklist items, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post: { summary: Add a checklist item, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '201': { description: Created } } }
  /tasks/{id}/comments:
    get: { summary: List comments, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post: { summary: Add a comment (supports @mentions), parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '201': { description: Created } } }
  /tasks/{id}/attachments:
    get: { summary: List attachments, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post:
      summary: Upload an attachment (multipart)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: Created }, '400': { description: Too large / disallowed / spoofed type } }
  /tasks/{id}/export.xlsx:
    get:
      summary: >-
        One task as an Excel workbook (Task, Checklist, Comments, Attachments, Dependencies, Activity).
        /tasks/{id}/export.pdf gives it as a branded PDF. Anyone who can open the task may export it.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 'File download named after the task, e.g. MICO-12-inspect-the-rig.xlsx' }
        '404': { description: No such task, or not visible to you }
  /tasks/{id}/dependencies:
    get: { summary: List blocked-by / blocks, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post:
      summary: Add a dependency (server rejects cycles)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [dependsOnTaskId], properties: { dependsOnTaskId: { type: string } } } } } }
      responses: { '201': { description: Created }, '409': { description: DEPENDENCY_CYCLE / DEPENDENCY_EXISTS } }

  /tasks/move-targets:
    get:
      summary: Where the caller may move tasks to another project
      description: >
        Administrators may move any task; anyone else needs to manage both the task's project and the one
        it goes to (its owner, its named manager or a MANAGER member of each). Tasks go only into open
        projects: not completed or archived.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MoveTargets' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tasks/move-preview:
    post:
      summary: What moving tasks to a project would change (nothing is moved)
      description: >
        For the move dialog: the new keys, the column each would go to, milestones cleared, due dates the
        project gives, repeats, and the people assigned who aren't on its team. A task the caller can't
        see is "not found", without its key or title. A project that can't take them (unknown, not
        managed by the caller, completed or archived) refuses the whole request.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [taskIds, projectId], properties: { taskIds: { type: array, items: { type: string }, minItems: 1, maxItems: 500 }, projectId: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MovePreview' } } } } } }
        '400': { description: VALIDATION, or PROJECT_CLOSED (the project is completed or archived) }
        '403': { description: 'FORBIDDEN: the caller may not move tasks into that project.' }
        '404': { description: Project not found. }
  /tasks/{id}/move-to-project:
    post:
      summary: Move a task to another project
      description: >
        The task gets the new project's next number (RIG-4 becomes OPS-17); its old key keeps finding it.
        Comments, files, checklist, history, watchers, blockers and the meeting link go with it; its board
        day stays; a milestone is cleared; an undated task gets today where new tasks are due today. Its
        completion follows the column (a Done column completes it). The newest copy of a repeating task
        takes its series along. Its history is filed under the new project, with UNASSIGNED lines for
        people taken off, an UPDATED line for a due date given or a milestone cleared, and PROJECT_CHANGED;
        the old project keeps a PROJECT_MOVED_OUT line (on no task) saying where it went. The move is
        saved only if the task is unchanged since it was read. The old project's board hears
        task:updated, the new one's task:created; the people following the task get one notice
        (TASK_STATUS, "RIG-4 moved to Operations", "… and marked complete" / "… and reopened").
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MoveInput' } } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MoveResult' } } } } } }
        '400': { description: 'VALIDATION (e.g. a column of another project), SAME_PROJECT, PROJECT_CLOSED or NO_COLUMNS' }
        '403': { description: 'FORBIDDEN: the caller does not manage both projects (and is not an administrator)' }
        '404': { description: Task or project not found (a task the caller can't see is not found) }
        '409': { description: 'ASSIGNEES_NOT_ON_TEAM (choose `assignees`; details.people names them), TASK_MOVED (someone else moved it first), VERSION_CONFLICT (it changed since it was read) or TASK_KEY_CONFLICT' }
  /tasks/move-to-project:
    post:
      summary: Move several tasks to another project, with a result for each
      description: >
        The same move as for one task, task by task in the order given, with one column (or each task's
        own kind of column) and one answer for people not on the new team. A project that can't take
        tasks refuses the whole request; anything else refuses only that task, in its result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MoveInput'
                - { type: object, required: [taskIds], properties: { taskIds: { type: array, items: { type: string }, minItems: 1, maxItems: 500 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BulkMoveResult' } } } } } }
        '400': { description: VALIDATION or PROJECT_CLOSED }
        '403': { description: 'FORBIDDEN: the caller may not move tasks into that project.' }
        '404': { description: Project not found. }

  /search:
    get:
      summary: Global search across tasks / projects / users
      description: >
        Tasks match by title, key, or a key they had before they moved to another project; each task
        result lists those old keys (formerKeys). A task whose key or old key is exactly the query comes first.
      parameters: [ { name: q, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK } }
  /notifications:
    get: { summary: Current user's notifications, responses: { '200': { description: OK } } }
  /notifications/unread-count:
    get: { summary: Unread notification count, responses: { '200': { description: OK } } }
  /reports/projects:
    get:
      summary: Project performance report (admin). Also /reports/status, /reports/workload, /reports/completion.
      parameters:
        - { name: projectId, in: query, schema: { type: string }, description: Only this project }
        - { name: userId, in: query, schema: { type: string }, description: Only tasks assigned to this team member }
      responses: { '200': { description: OK }, '403': { description: Forbidden } }
  /reports/projects.csv:
    get:
      summary: >-
        Project performance as a download (admin) — .xlsx (formatted Excel workbook), .pdf (branded
        report with logo, sections, tables and page numbers), .csv, or .xls (older SpreadsheetML, kept
        for old links). The same suffixes exist for /reports/status, /reports/workload and
        /reports/timeseries (which also takes from / to).
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
      responses:
        '200':
          description: >-
            File download. Content-Disposition names it report + filters + the company day, e.g.
            project-performance-rig-inspection-portal-2026-10-01.csv (exposed to cross-origin callers).
        '403': { description: Forbidden }
  /reports/export.xlsx:
    get:
      summary: >-
        The full report (admin) as one Excel workbook — a sheet per section (Summary, Status, Projects,
        Team workload, Trend, Tasks) with titles, the filters used, frozen bold headers and sized
        columns. /reports/export.pdf gives the same report as a branded landscape PDF.
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Trend period start (default 30 days before `to`) }
        - { name: to, in: query, schema: { type: string, format: date }, description: Trend period end (default the company's today) }
        - { name: sections, in: query, schema: { type: string, example: 'summary,tasks' }, description: 'Comma-separated subset of summary, status, projects, workload, trend, tasks (default all)' }
      responses:
        '200': { description: 'File download, e.g. tasks-report-mico360-platform-2026-10-01.xlsx' }
        '400': { description: Unknown section, or from after to }
        '403': { description: Forbidden }
  /users/me/export:
    get:
      summary: Download my data — everything held about the signed-in person, as a JSON file (recorded in the audit log)
      responses:
        '200': { description: JSON file (Content-Disposition attachment) }
        '401': { description: Not signed in }
  /meetings/{id}/notes/{noteId}/restore:
    post:
      summary: Undo a meeting-note delete (notes are soft-deleted). The note's author or the meeting's organizer only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: noteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The restored note }
        '403': { description: Not the author or organizer }
        '404': { description: No deleted note with that id in this meeting }
