openapi: 3.0.3
info:
  title: MICO360 Tasks API
  version: 1.0.0
  description: >-
    REST API for MICO360 Tasks (web app, Chrome extension, and the Phase 2 Android
    app). All responses use a JSON envelope: success is `{ "data": ... }`, errors
    are `{ "error": { "code": string, "message": string, "details"?: any } }`.
    Authenticate by sending `Authorization: Bearer <accessToken>`.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: https://task.mico360.com/api/v1
    description: Production

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: INVALID_CREDENTIALS }
            message: { type: string }
            details: {}
    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        refreshToken: { type: string }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        roles: { type: array, items: { type: string, enum: [ADMIN, EMPLOYEE] } }
    Task:
      type: object
      properties:
        id: { type: string }
        key: { type: string, example: MICO-142 }
        title: { type: string }
        description: { type: string, nullable: true }
        projectId: { type: string }
        columnId: { type: string }
        position: { type: integer }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        dueDate: { type: string, format: date-time, nullable: true }
        progress: { type: integer }
        recurrenceRule:
          nullable: true
          description: The repeat rule. Only the newest copy of a recurring series carries it.
          $ref: '#/components/schemas/RecurrenceRule'
        recurrenceParentId:
          type: string
          nullable: true
          description: Set on every copy of a recurring series (the first task's id; the first task links to itself once it has a copy).
        recurrenceNextId:
          type: string
          nullable: true
          description: >
            GET /tasks/{id} only. The copy made from this task. Set means this is an earlier copy: setting
            a repeat on it is refused with 409 RECURRENCE_NOT_NEWEST (it would start a second series).
        meetingId:
          type: string
          nullable: true
          description: The meeting this task was created from (a Live note made into a task); its next repeat copies keep it.
        formerKeys:
          type: array
          items: { type: string }
          example: [RIG-4]
          description: >
            GET /tasks/{id} only. Keys the task had before it moved to another project, oldest first.
            Each still finds it (search, "open RIG-4"), and no other task is ever given one of them.
        meeting:
          type: object
          nullable: true
          description: >
            GET /tasks/{id} only. The meeting the task was created from, as the caller may see it; null when
            there is none or it was deleted. For someone who may not see the meeting, title and startAt are
            null and canView is false.
          properties:
            id: { type: string }
            title: { type: string, nullable: true }
            startAt: { type: string, format: date-time, nullable: true }
            canView: { type: boolean }
    RecurrenceRule:
      type: object
      description: >
        A task's repeat schedule. When the next copy is made it keeps the title, description,
        priority, estimate, assignees, watchers, tags and checklist (unticked), lands in the
        project's first open column, and takes over the rule. A task never gets two next copies
        (enforced by the database), so completing it twice, or from several apps at once, makes one.
      required: [freq, interval]
      properties:
        freq: { type: string, enum: [DAILY, WEEKLY, MONTHLY, QUARTERLY, YEARLY] }
        interval: { type: integer, minimum: 1, description: 'Every N days / weeks / months / quarters / years.' }
        count: { type: integer, nullable: true, description: 'End after this many tasks in the series.' }
        until: { type: string, nullable: true, description: 'Last date (YYYY-MM-DD) a copy may be due.' }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 'WEEKLY: the days (0 = Sunday).' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, description: 'MONTHLY / QUARTERLY: the day (31 = the last day of each month).' }
        nthWeekday:
          type: object
          description: 'MONTHLY / QUARTERLY, instead of dayOfMonth: "the 2nd Tuesday" or "the last Friday".'
          properties:
            week: { type: integer, enum: [1, 2, 3, 4, -1], description: '-1 = the last one of the month.' }
            day: { type: integer, minimum: 0, maximum: 6 }
        createNext:
          type: string
          enum: [ON_COMPLETE, ON_SCHEDULE]
          description: >
            ON_COMPLETE (default): the next copy is made when this one is completed, dated by the
            rule and never already overdue (missed dates are skipped). ON_SCHEDULE: a copy is made
            on each due date whether or not the previous one is done (an hourly server job; missed
            days collapse into one copy).
        paused: { type: boolean, description: 'No new copies while paused.' }
    Project:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        carryForward:
          type: boolean
          description: >
            Each night, unfinished tasks on past board days move to today's board (default true). The
            company-wide setting carryForward.enabled comes first: when it is off, nothing carries.
            Optional on create and update (admin); left out of an update, it stays as it is.
        defaultDueToday:
          type: boolean
          description: >
            Default false. When true, a task created in the project (or moved into it) without a due date gets one: the
            board day it is created on (the task's boardDate) when that day is later than today, else
            today, the company's calendar day (a past board day also gives today). It is stored like
            any due date (UTC midnight of that day). A due date that is sent is always kept. A task
            sent with a start date later than that day and no due date stays undated. Clearing the due
            date later leaves it clear. Optional on create and update (admin); left out of an update,
            it stays as it is.
    MovePerson:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Sara Al Balushi }
    MoveProject:
      type: object
      properties:
        id: { type: string }
        code: { type: string, example: OPS }
        name: { type: string, example: Operations }
        status: { type: string, enum: [PLANNING, ACTIVE, ON_HOLD] }
        color: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
    MoveTargets:
      type: object
      description: Where the caller may move tasks to, and whose tasks they may move.
      properties:
        managesAll: { type: boolean, description: 'An administrator: any task, to any open project.' }
        managedProjectIds:
          type: array
          items: { type: string }
          description: "The projects the caller manages (its owner, its named manager or a MANAGER member), whatever their status. Their tasks may be moved out. Empty for an administrator."
        projects:
          type: array
          items: { $ref: '#/components/schemas/MoveProject' }
          description: Open projects (not completed or archived) the caller may move tasks into, by name.
    MoveInput:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string, description: The project to move the task to. }
        columnId:
          type: string
          description: >
            A column of that project. Left out, each task goes to the project's first column of the same
            kind (status category) as the one it is in now, or its first column when it has none of that kind
            (columns switched off in Manage columns are used only when there is no other).
        assignees:
          type: string
          enum: [ADD_TO_TEAM, UNASSIGN]
          description: >
            What happens to people assigned to the task who aren't on the new project's team (its owner,
            manager, creator, members, and administrators): added to the team as members, or taken off the
            task. Required when there are such people: without it the move is refused with 409
            ASSIGNEES_NOT_ON_TEAM, naming them in error.details.people.
    TaskMovePreview:
      type: object
      properties:
        id: { type: string }
        key: { type: string, description: 'Its key now (empty for a task that is not found).' }
        title: { type: string }
        from: { type: object, nullable: true, properties: { id: { type: string }, code: { type: string }, name: { type: string } } }
        canMove: { type: boolean }
        reason: { type: string, nullable: true, example: You need to manage Admin to move its tasks. }
        newKey: { type: string, nullable: true, example: OPS-17, description: 'The key it would get: the next number now, in order for several tasks. A task created there at the same moment can take it; the move then takes the next.' }
        currentCategory: { type: string, nullable: true, description: The status category of the column it is in now. }
        completed: { type: boolean, description: 'It is completed now: moved to an open column it is re-opened; an open task moved to a Done column is completed.' }
        columnId: { type: string, nullable: true, description: 'Where it goes unless another column is chosen.' }
        milestoneCleared: { type: boolean, description: 'It is a milestone: moving clears it (milestones belong to their project).' }
        dueDate: { type: string, nullable: true, example: '2026-10-24', description: "The due day it gets from the new project's \"New tasks are due today\" (it has none now)." }
        repeat:
          type: string
          nullable: true
          enum: [SERIES, COPY]
          description: 'SERIES: the newest copy of a repeating task; its next copies are made in the new project. COPY: an earlier copy, which moves alone.'
        outsiders: { type: array, items: { $ref: '#/components/schemas/MovePerson' }, description: People assigned to it who aren't on the new team. }
    MovePreview:
      type: object
      properties:
        project: { allOf: [{ $ref: '#/components/schemas/MoveProject' }, { type: object, properties: { defaultDueToday: { type: boolean } } }] }
        columns:
          type: array
          description: The new project's switched-on columns, in board order.
          items: { type: object, properties: { id: { type: string }, name: { type: string }, category: { type: string }, position: { type: integer }, enabled: { type: boolean } } }
        tasks: { type: array, items: { $ref: '#/components/schemas/TaskMovePreview' }, description: 'One per task asked about, in that order.' }
        outsiders: { type: array, items: { $ref: '#/components/schemas/MovePerson' }, description: 'Everyone not on the new team across the tasks that can move, once each.' }
    MoveResult:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Task' }
        from: { type: object, properties: { projectId: { type: string }, name: { type: string }, key: { type: string, example: RIG-4 } } }
        to: { type: object, properties: { projectId: { type: string }, name: { type: string }, key: { type: string, example: OPS-17 } } }
        addedToTeam: { type: array, items: { $ref: '#/components/schemas/MovePerson' } }
        unassigned: { type: array, items: { $ref: '#/components/schemas/MovePerson' } }
        milestoneCleared: { type: boolean }
        dueDateSet: { type: string, nullable: true, example: '2026-10-24' }
        statusChange: { type: string, nullable: true, enum: [COMPLETED, REOPENED], description: 'The move completed the task (into a Done column) or re-opened it (out of one).' }
    BulkMoveResult:
      type: object
      properties:
        results:
          type: array
          description: One per task asked for, in that order. A refused task never hides the others' success.
          items:
            oneOf:
              - allOf: [{ type: object, properties: { taskId: { type: string }, ok: { type: boolean, enum: [true] } } }, { $ref: '#/components/schemas/MoveResult' }]
              - type: object
                properties:
                  taskId: { type: string }
                  ok: { type: boolean, enum: [false] }
                  error: { type: object, properties: { code: { type: string, example: ASSIGNEES_NOT_ON_TEAM }, message: { type: string }, details: {} } }
        moved: { type: integer }
        failed: { type: integer }
    MicoAiChat:
      type: object
      description: One of the signed-in person's own MICO AI chats (nobody else can open it, admins included).
      properties:
        id: { type: string }
        title: { type: string, description: "'' until the first question names it (a short, plain line from that question); the person can rename it." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastMessageAt: { type: string, format: date-time }
        match: { type: string, nullable: true, description: 'With ?q=: words around the match in a message (null when the title matched).' }
    MicoAiSource:
      type: object
      description: A record an answer used. Only records a tool returned for this person (in this question or a recent one) are kept.
      properties:
        type: { type: string, enum: [task, project, meeting, chat, person] }
        id: { type: string }
        label: { type: string, example: RIG-14 }
        url: { type: string, nullable: true, description: "The website path that opens it ('?task=<id>' opens the task panel on the current page; a person has none)." }
    MicoAiMessage:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        status: { type: string, enum: [pending, done, error, stopped] }
        text: { type: string, description: 'The question, or the answer in a small Markdown subset (paragraphs, "- " bullets, **bold**).' }
        createdAt: { type: string, format: date-time }
        step: { type: string, nullable: true, description: 'While pending: what MICO AI is doing, e.g. "Checking tasks in Rig Inspection…".' }
        error: { type: string, description: 'For status error: what went wrong, in plain English.' }
        answer:
          type: object
          description: For a done answer.
          properties:
            kind: { type: string, enum: [answer, clarify], description: 'clarify: a clarifying question; its quick replies are in options.' }
            unavailable: { type: boolean, description: "The data doesn't hold the answer (shown as a note); nothing was guessed." }
            options: { type: array, items: { type: string } }
            followUps: { type: array, items: { type: string } }
            sources: { type: array, items: { $ref: '#/components/schemas/MicoAiSource' } }
            tables:
              type: array
              description: Built by the server from the tool results the answer names, never from the model's text.
              items:
                type: object
                properties:
                  title: { type: string }
                  fromResult: { type: string }
                  columns: { type: array, items: { type: object, properties: { key: { type: string }, label: { type: string }, kind: { type: string, enum: [text, key, date, datetime, number, percent, days] } } } }
                  rows: { type: array, items: { type: object, properties: { ref: { $ref: '#/components/schemas/MicoAiSource' }, cells: { type: array, items: {} } } } }
                  total: { type: integer, description: 'How many matched in all: more than the rows when the list was capped at 200 ("Showing 200 of 250").' }
  responses:
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

security:
  - bearerAuth: []

paths:
  /health:
    get:
      security: []
      summary: Liveness probe (status + uptime)
      responses:
        '200': { description: OK }
  /metrics:
    get:
      summary: Process metrics (uptime, memory) — administrators only
      responses:
        '200': { description: OK }
        '403': { description: Forbidden }
  /config:
    get:
      security: []
      summary: Public client settings — company time zone, product name, whether email is set up, the Android app download link (androidAppUrl, may be null) and the server time
      responses:
        '200': { description: OK }

  /auth/login:
    post:
      security: []
      summary: Log in with email-or-username + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: email or username }
                password: { type: string }
      responses:
        '200':
          description: Session issued
          content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Session' } } } } }
        '401': { description: Invalid credentials }
        '423': { description: Account locked (5 failed attempts) — reset password to unlock }
  /auth/otp/request:
    post:
      security: []
      summary: Request a passwordless email login code
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string } } } } }
      responses: { '200': { description: A code is emailed if the account exists } }
  /auth/otp/verify:
    post:
      security: []
      summary: Verify an email login code
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier, code], properties: { identifier: { type: string }, code: { type: string } } } } }
      responses: { '200': { description: Session issued }, '401': { description: Invalid/expired code } }
  /auth/password/forgot:
    post:
      security: []
      summary: Request a password-reset link (never reveals account existence)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string } } } } }
      responses: { '200': { description: '{ sent: true }' } }
  /auth/password/reset:
    post:
      security: []
      summary: Reset a password with a token (also unlocks the account)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } } } }
      responses: { '200': { description: '{ reset: true }' }, '400': { description: Invalid token / weak password } }
  /auth/refresh:
    post:
      security: []
      summary: Exchange a refresh token for a new session (the token is rotated)
      description: >
        Each refresh token works once. If the reply was lost, presenting the same token again within
        2 minutes returns the same new refresh token (with a fresh access token) while that one is
        unused; later, or once it was used, it is treated as theft and the whole sign-in is ended.
        A fingerprint sign-in key is refused here.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses: { '200': { description: Session issued }, '401': { description: Invalid, expired, or already used } }
  /auth/biometric-credential:
    post:
      security: []
      summary: A fingerprint sign-in key for this phone, made with its session's refresh token
      description: >
        A refresh token marked for fingerprint sign-in, in a rotation family of its own. It never
        refreshes a session; it only signs in through /auth/biometric-sign-in, which doesn't spend it.
        The session's refresh token is checked, not spent (an access token alone can't make a key).
        It lasts 30 days from the person's last sign-in or refresh. A password change, an admin
        reset, or a stolen session caught being reused revokes it. `keyId` cancels it (below).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string } } } } }
      responses: { '201': { description: '{ refreshToken (the key), keyId }' }, '401': { description: 'INVALID_REFRESH_TOKEN: the session ended' } }
  /auth/biometric-credential/revoke:
    post:
      security: []
      summary: Cancel one of the person's fingerprint keys (turned off on the phone, or replaced)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken, keyId], properties: { refreshToken: { type: string }, keyId: { type: string, pattern: '^[0-9a-f]{64}$' } } }
      responses: { '200': { description: '{ ok: true } (also when the key had already ended)' }, '401': { description: 'INVALID_REFRESH_TOKEN: the session ended' } }
  /auth/biometric-sign-in:
    post:
      security: []
      summary: Sign in with a phone's fingerprint sign-in key (the key is not spent)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [credential], properties: { credential: { type: string } } } } }
      responses: { '200': { description: Session issued }, '401': { description: 'INVALID_BIOMETRIC_KEY: revoked, expired or not a fingerprint key' } }

  /projects:
    get:
      summary: List projects
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } }
    post:
      summary: Create a project (admin)
      responses: { '201': { description: Created }, '403': { description: Forbidden } }
  /projects/{id}/columns:
    get:
      summary: List a project's Kanban columns
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }

  /tasks:
    get:
      summary: List tasks (optionally filtered by projectId/columnId)
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: columnId, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      summary: Create a task
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
      responses: { '201': { description: Created } }
  /tasks/mine:
    get:
      summary: Tasks assigned to the current user
      responses: { '200': { description: OK } }
  /tasks/{id}:
    get:
      summary: Get a task
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK }, '404': { description: Not found } }
    put:
      summary: Update a task
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: OK } }
    delete:
      summary: Delete a task (admin)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: Deleted } }
  /tasks/{id}/move:
    patch:
      summary: Move a task to a column (Kanban drag-drop persistence)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [columnId], properties: { columnId: { type: string }, position: { type: integer } } } } }
      responses: { '200': { description: OK } }
  /tasks/{id}/assignees:
    get: { summary: List assignees, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post:
      summary: Assign users (many-to-many)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [userIds], properties: { userIds: { type: array, items: { type: string } } } } } } }
      responses: { '200': { description: OK } }
  /tasks/{id}/assignees/swap:
    post:
      summary: >-
        Hand the task from one person to another in one write (the Workload page's suggestion) — the
        same view check and assignee rules as adding someone, with the usual notifications and activity.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [from, to], properties: { from: { type: string }, to: { type: string }, expectedVersion: { type: integer } } } } } }
      responses:
        '200': { description: The task's assignees now }
        '400': { description: '`to` may not be assigned in the task''s project' }
        '403': { description: Not allowed to see the task }
        '409': { description: 'VERSION_CONFLICT (changed since expectedVersion), TASK_DONE, or ASSIGNEE_GONE (`from` is no longer on it)' }
  /tasks/{id}/checklist:
    get: { summary: List checklist items, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post: { summary: Add a checklist item, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '201': { description: Created } } }
  /tasks/{id}/comments:
    get: { summary: List comments, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post: { summary: Add a comment (supports @mentions), parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '201': { description: Created } } }
  /tasks/{id}/attachments:
    get: { summary: List attachments, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post:
      summary: Upload an attachment (multipart)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: Created }, '400': { description: Too large / disallowed / spoofed type } }
  /tasks/{id}/export.xlsx:
    get:
      summary: >-
        One task as an Excel workbook (Task, Checklist, Comments, Attachments, Dependencies, Activity).
        /tasks/{id}/export.pdf gives it as a branded PDF. Anyone who can open the task may export it.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: 'File download named after the task, e.g. MICO-12-inspect-the-rig.xlsx' }
        '404': { description: No such task, or not visible to you }
  /tasks/{id}/dependencies:
    get: { summary: List blocked-by / blocks, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], responses: { '200': { description: OK } } }
    post:
      summary: Add a dependency (server rejects cycles)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [dependsOnTaskId], properties: { dependsOnTaskId: { type: string } } } } } }
      responses: { '201': { description: Created }, '409': { description: DEPENDENCY_CYCLE / DEPENDENCY_EXISTS } }

  /tasks/move-targets:
    get:
      summary: Where the caller may move tasks to another project
      description: >
        Administrators may move any task; anyone else needs to manage both the task's project and the one
        it goes to (its owner, its named manager or a MANAGER member of each). Tasks go only into open
        projects: not completed or archived.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MoveTargets' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tasks/move-preview:
    post:
      summary: What moving tasks to a project would change (nothing is moved)
      description: >
        For the move dialog: the new keys, the column each would go to, milestones cleared, due dates the
        project gives, repeats, and the people assigned who aren't on its team. A task the caller can't
        see is "not found", without its key or title. A project that can't take them (unknown, not
        managed by the caller, completed or archived) refuses the whole request.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [taskIds, projectId], properties: { taskIds: { type: array, items: { type: string }, minItems: 1, maxItems: 500 }, projectId: { type: string } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MovePreview' } } } } } }
        '400': { description: VALIDATION, or PROJECT_CLOSED (the project is completed or archived) }
        '403': { description: 'FORBIDDEN: the caller may not move tasks into that project.' }
        '404': { description: Project not found. }
  /tasks/{id}/move-to-project:
    post:
      summary: Move a task to another project
      description: >
        The task gets the new project's next number (RIG-4 becomes OPS-17); its old key keeps finding it.
        Comments, files, checklist, history, watchers, blockers and the meeting link go with it; its board
        day stays; a milestone is cleared; an undated task gets today where new tasks are due today. Its
        completion follows the column (a Done column completes it). The newest copy of a repeating task
        takes its series along. Its history is filed under the new project, with UNASSIGNED lines for
        people taken off, an UPDATED line for a due date given or a milestone cleared, and PROJECT_CHANGED;
        the old project keeps a PROJECT_MOVED_OUT line (on no task) saying where it went. The move is
        saved only if the task is unchanged since it was read. The old project's board hears
        task:updated, the new one's task:created; the people following the task get one notice
        (TASK_STATUS, "RIG-4 moved to Operations", "… and marked complete" / "… and reopened").
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MoveInput' } } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/MoveResult' } } } } } }
        '400': { description: 'VALIDATION (e.g. a column of another project), SAME_PROJECT, PROJECT_CLOSED or NO_COLUMNS' }
        '403': { description: 'FORBIDDEN: the caller does not manage both projects (and is not an administrator)' }
        '404': { description: Task or project not found (a task the caller can't see is not found) }
        '409': { description: 'ASSIGNEES_NOT_ON_TEAM (choose `assignees`; details.people names them), TASK_MOVED (someone else moved it first), VERSION_CONFLICT (it changed since it was read) or TASK_KEY_CONFLICT' }
  /tasks/move-to-project:
    post:
      summary: Move several tasks to another project, with a result for each
      description: >
        The same move as for one task, task by task in the order given, with one column (or each task's
        own kind of column) and one answer for people not on the new team. A project that can't take
        tasks refuses the whole request; anything else refuses only that task, in its result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MoveInput'
                - { type: object, required: [taskIds], properties: { taskIds: { type: array, items: { type: string }, minItems: 1, maxItems: 500 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BulkMoveResult' } } } } } }
        '400': { description: VALIDATION or PROJECT_CLOSED }
        '403': { description: 'FORBIDDEN: the caller may not move tasks into that project.' }
        '404': { description: Project not found. }
  /timeline:
    get:
      summary: >-
        The Timeline page — every open project (not Completed or Archived) the caller may see, exactly
        as the projects list decides, with its bar, status against its dates, milestones, meetings and
        the open tasks due each week. One request, answered by a fixed number of grouped queries.
      description: >-
        Days are company-time calendar days. `from` / `to` are widened to whole weeks starting on
        `weekStart`. Each project: `start` (its own start date, else its tasks' earliest start or due
        date, else the day it was created) with `startFrom` (project | tasks | created), `target` (its
        own target date, else its tasks' latest due date, or null) with `targetFrom` (project | tasks |
        null) — the project's own date always wins, field by field, and every live task counts, done
        or not; a start from its tasks after its own target, or an end from its tasks before its own
        start, is left out; a project whose end comes from its tasks is not late once every task is done —
        `tasks` { total, done, open, overdue }, `progress`
        (share done, rounded as on the Projects page: 99 until every task is done), `timeUsed` (share
        of the days from start to target gone, 0–100; null without a target), `health` — `late`
        (target day passed; `daysLate`), `at-risk` (timeUsed − progress ≥ 20), `on-track` or
        `no-target` — `dueByWeek` (open tasks due in each of `weeks`), `milestones` due in the shown
        weeks [{ id, key, title, date, done }] by date, `nextMilestone` (the earliest not reached, else
        an undated one), `milestoneCount`, `milestonesSoon` (not reached, due from today to 30 days on),
        `meetings` in the shown weeks [{ id, title, startAt, day }] (not cancelled) and
        `meetingsThisWeek`. No read is capped. `from` and `to` must be within two years of today.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: weekStart, in: query, schema: { type: integer, enum: [0, 1, 6], default: 0 }, description: 'First day of the week: 0 Sunday, 1 Monday, 6 Saturday' }
      responses:
        '200':
          description: >-
            `{ data: { from, to, weekStart, today, currentWeek, weeks: [date], projects: [TimelineProject] } }`
            — each project also carries id, code, name, color, icon, imageUrl, status and owner { id, name, avatarUrl }.
        '400': { description: 'VALIDATION: a missing or unreal date, a date more than two years from today, an unknown week start, `to` before `from`, or more than 53 weeks' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /timeline/projects/{id}/tasks:
    get:
      summary: >-
        One project's task lane on the Timeline, read when its row is opened: its open overdue tasks
        (the most overdue first), then its open tasks in (or reaching into) the shown weeks by their
        first day (start, else due), then its done tasks there (the latest due first) — at most 30.
        Same projects as GET /timeline (one the caller may see, not completed or archived) and the
        same two-year reach.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: >-
            `{ data: { projectId, from, to, today, matched, open, undated, tasks: [{ id, key, title, start (or null:
            drawn as a marker), due, done, overdue, priority, isMilestone, assignees: [{ id, name }] }] } }`
            — `matched` is how many tasks the lane holds (open overdue ones and every task in the shown weeks;
            more than `tasks` when rows were cut), `open` every open task of the project, `undated` its open
            tasks without a due date.
        '400': { description: 'VALIDATION: a missing or unreal date, a date more than two years from today, `to` before `from`, or more than 53 weeks' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'No such project, not visible to the caller, or completed or archived' }
  /workload:
    get:
      summary: >-
        The Workload page — open tasks due each day of a week, per person, against the company's daily
        limit (system setting `workload.dailyLimit`, 1–50, default 5; administrators change it with
        PUT /system-settings/workload.dailyLimit). An administrator sees everyone; a project manager
        (the project's manager or owner, or a MANAGER member) the people on the projects they manage
        and only those projects' tasks (their own row: all their own tasks in the projects they can see);
        anyone else only their own row. Completed and archived projects are left out.
      description: >-
        Days off come from the company's working hours (`meetings.workingHours`): on a day off the
        limit is 0. For each day over the limit, as many tasks as it is over carry one `suggestion`:
        `{ kind: reassign, to: { id, name }, count }` — the least-busy person on the task's project team
        (active, shown to the caller, not already on the task) with room that day; `count` is their
        number that day for an administrator only (null for anyone else) — or `{ kind: move, date }`,
        the next working day (today or later, within three weeks) with room for everyone on the task.
        Teammates and days are weighed by everyone's whole load (every live project, also people the
        caller can't see, whose figures are never sent), and each suggestion counts towards the next.
        Only administrators and project managers get reassign suggestions. Nothing is changed: the page
        applies a suggestion with POST /tasks/{id}/assignees/swap or PUT /tasks/{id} (with expectedVersion).
      parameters:
        - { name: week, in: query, required: true, schema: { type: string, format: date }, description: The first of the seven days shown }
        - { name: projectId, in: query, schema: { type: string }, description: 'Only this project''s tasks, and its team and whoever has its tasks (ignored when not in the caller''s scope)' }
      responses:
        '200':
          description: >-
            `{ data: { week, today, days: [{ date, working }], limit, canChangeLimit, scope: everyone|teams|self,
            projectId, projects: [{ id, code, name, color, icon, imageUrl }], people: [{ id, name, avatarUrl, me,
            overdue, total, weekLimit, days: [{ date, count, limit, over, tasks: [{ id, key, title, projectId,
            priority, version, suggestion }] }] }] } }` — in a day's tasks the suggested ones come first.
        '400': { description: 'VALIDATION: a missing or unreal week, or one more than two years from today' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /management/access:
    get:
      summary: May the caller see the Management page? (the sidebar link)
      description: >-
        `{ data: { allowed, scope: ALL|RUN|null } }` — ALL for administrators (every project), RUN for the people
        who run a live project (its owner, named manager or a MANAGER member: the projects they run), else not allowed.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /management/overview:
    get:
      summary: >-
        The Management page — every project's health (a red / amber / green mark with its reasons, worst first),
        inspections (checks due, done, done late, missing, closed without a report, pass rate, most-failed items and
        forms, open follow-ups), people (late work, days over the Workload daily limit this week, open action items)
        and weekly trends (created, completed, late at each week's end, pass rate), for the caller's scope.
      description: >-
        Red: a milestone overdue and not done; late tasks at least 25% of the open ones with at least 3 late; or 3+
        missing checks. Amber: otherwise any late task, any missing check, or an ACTIVE project with no activity for 14
        days. Weeks are company weeks (company time zone; system setting `company.weekStart`, 0 Sunday by default, 1
        Monday or 6 Saturday); the current week is the last (partial). The period (`weeks`) applies to the trends and the
        inspection statistics; late tasks, missing checks, follow-ups, this week's workload and action items are now.
      parameters:
        - { name: projectIds, in: query, schema: { type: string }, description: 'Comma-separated project ids (each must be in the caller''s scope, else 404)' }
        - { name: ownerId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: 'Comma-separated project statuses; default PLANNING,ACTIVE,ON_HOLD' }
        - { name: weeks, in: query, schema: { type: integer, enum: [4, 12, 26], default: 12 } }
      responses:
        '200': { description: '`{ data: { scope, generatedAt, timeZone, today, weekStart, filters, period, options, tiles, projects, inspections, people, workload, trends } }`' }
        '400': { description: 'VALIDATION: an unknown status, a period other than 4, 12 or 26 weeks, or a malformed id' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Not an administrator and runs no project' }
        '404': { description: 'A chosen project outside the caller''s scope' }
  /management/items:
    get:
      summary: The list behind a number on the Management page (at most 200 rows, with the full count), inside the caller's scope and filters
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [late-tasks, late-milestones, missing-checks, checks-due, checks-done, checks-done-late, checks-no-report, follow-ups, inspections, failed-item, person-overloaded, person-actions, projects, people-overloaded] } }
        - { name: projectId, in: query, schema: { type: string }, description: 'One project (404 outside the caller''s scope)' }
        - { name: personId, in: query, schema: { type: string }, description: 'One person''s rows (only inside the caller''s projects); required for person-overloaded' }
        - { name: formId, in: query, schema: { type: string }, description: 'failed-item: the form (none: inspections whose form is gone)' }
        - { name: itemId, in: query, schema: { type: string }, description: 'failed-item: the item (required)' }
        - { name: rag, in: query, schema: { type: string, enum: [RED, AMBER, GREEN] }, description: 'projects: one mark' }
        - { name: projectIds, in: query, schema: { type: string } }
        - { name: ownerId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: weeks, in: query, schema: { type: integer, enum: [4, 12, 26] } }
      responses:
        '200': { description: '`{ data: { metric, title, total, limit, rows: [{ kind: task|inspection|action|project|person, id, title, key, project, due, daysLate, people, detail, tone, meetingId, taskId, at }] } }`' }
        '400': { description: 'VALIDATION: an unknown list, or a person / item missing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Not an administrator and runs no project' }
        '404': { description: 'A project outside the caller''s scope' }
  /management/overview.pdf:
    get:
      summary: The Management overview as a branded PDF (the same filters; logo, the filters in words, generated at in company time, page numbers)
      description: Ten a minute per person. The file is named by the server (management-overview[-<one project>]-<company day>.pdf, Content-Disposition).
      responses:
        '200': { description: application/pdf }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 'Not an administrator and runs no project' }
        '429': { description: RATE_LIMITED }

  /search:
    get:
      summary: Global search across tasks / projects / users
      description: >
        Tasks match by title, key, or a key they had before they moved to another project; each task
        result lists those old keys (formerKeys). A task whose key or old key is exactly the query comes first.
      parameters: [ { name: q, in: query, schema: { type: string } } ]
      responses: { '200': { description: OK } }
  /notifications:
    get: { summary: Current user's notifications, responses: { '200': { description: OK } } }
  /notifications/unread-count:
    get: { summary: Unread notification count, responses: { '200': { description: OK } } }
  /reports/projects:
    get:
      summary: Project performance report (admin). Also /reports/status, /reports/workload, /reports/completion.
      parameters:
        - { name: projectId, in: query, schema: { type: string }, description: Only this project }
        - { name: userId, in: query, schema: { type: string }, description: Only tasks assigned to this team member }
      responses: { '200': { description: OK }, '403': { description: Forbidden } }
  /reports/projects.csv:
    get:
      summary: >-
        Project performance as a download (admin) — .xlsx (formatted Excel workbook), .pdf (branded
        report with logo, sections, tables and page numbers), .csv, or .xls (older SpreadsheetML, kept
        for old links). The same suffixes exist for /reports/status, /reports/workload and
        /reports/timeseries (which also takes from / to).
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
      responses:
        '200':
          description: >-
            File download. Content-Disposition names it report + filters + the company day, e.g.
            project-performance-rig-inspection-portal-2026-10-01.csv (exposed to cross-origin callers).
        '403': { description: Forbidden }
  /reports/export.xlsx:
    get:
      summary: >-
        The full report (admin) as one Excel workbook — a sheet per section (Summary, Status, Projects,
        Team workload, Trend, Tasks) with titles, the filters used, frozen bold headers and sized
        columns. /reports/export.pdf gives the same report as a branded landscape PDF.
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date }, description: Trend period start (default 30 days before `to`) }
        - { name: to, in: query, schema: { type: string, format: date }, description: Trend period end (default the company's today) }
        - { name: sections, in: query, schema: { type: string, example: 'summary,tasks' }, description: 'Comma-separated subset of summary, status, projects, workload, trend, tasks (default all)' }
      responses:
        '200': { description: 'File download, e.g. tasks-report-mico360-platform-2026-10-01.xlsx' }
        '400': { description: Unknown section, or from after to }
        '403': { description: Forbidden }
  /users/me/export:
    get:
      summary: Download my data — everything held about the signed-in person, as a JSON file (recorded in the audit log)
      responses:
        '200': { description: JSON file (Content-Disposition attachment) }
        '401': { description: Not signed in }
  /mico-ai/status:
    get:
      summary: >-
        Whether MICO AI can answer: ready false (with the message "MICO AI isn’t set up yet. An administrator
        can add the AI service in AI Management.") when no chat model is set up in AI Management.
      responses: { '200': { description: '{ ready: boolean, message: string | null }' } }
  /mico-ai/chats:
    get:
      summary: The signed-in person's own chats, newest activity first; ?q= searches their titles and messages.
      parameters: [ { name: q, in: query, schema: { type: string, maxLength: 200 } } ]
      responses: { '200': { description: 'MicoAiChat[]', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/MicoAiChat' } } } } } } } }
    post:
      summary: Start a chat (the first question names it unless a title is given).
      requestBody: { content: { application/json: { schema: { type: object, properties: { title: { type: string, maxLength: 200 } } } } } }
      responses: { '201': { description: The new MicoAiChat } }
  /mico-ai/chats/{chatId}:
    parameters: [ { name: chatId, in: path, required: true, schema: { type: string } } ]
    get:
      summary: >-
        One of the person's chats with its latest 50 messages (hasMore: there are older ones; GET
        …/messages?before= pages back). Anyone else's chat is 404, admins included. Answers still
        pending past the time limit (cut off by a restart) read as interrupted.
      responses: { '200': { description: '{ chat: MicoAiChat, messages: MicoAiMessage[], hasMore: boolean }' }, '404': { description: No such chat, or not yours } }
    patch:
      summary: Rename the chat.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string, minLength: 1, maxLength: 200 } } } } } }
      responses: { '200': { description: The MicoAiChat }, '404': { description: No such chat, or not yours } }
    delete:
      summary: Delete the chat and all its messages, for good.
      responses: { '204': { description: Deleted }, '404': { description: No such chat, or not yours } }
  /mico-ai/chats/{chatId}/messages:
    parameters: [ { name: chatId, in: path, required: true, schema: { type: string } } ]
    get:
      summary: Older messages of the chat, a page at a time, before the message `before` (oldest first).
      parameters:
        - { name: before, in: query, required: true, schema: { type: string }, description: A message id }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses: { '200': { description: '{ messages: MicoAiMessage[], hasMore: boolean }' }, '404': { description: No such chat, or not yours } }
    post:
      summary: >-
        Ask a question. Returns at once (202) with the question and a pending answer; MICO AI then reads,
        with the person's own access only (read-only tools: tasks, projects, meetings and minutes, report
        figures, team chat they are part of, people), and writes the answer — or, when asked to make or
        change something, a card of proposed changes (answer.kind "proposal") that changes nothing until
        it is confirmed (…/confirm). Poll the answer for its step
        and result. The question counts once against the person's per-minute AI limit and every AI call it
        makes against their daily limit (both shared with the other AI features); an answer may take at
        most 3 minutes. One answer at a time per chat. The audit
        log records only that MICO AI was used (action mico-ai.ask, no question or answer).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, minLength: 1, maxLength: 4000 }, retryOf: { type: string, description: 'Retry: the answer this asks again. Its unconfirmed card (and any unconfirmed card for the same question) is superseded, so two cards are never live.' } } } } } }
      responses:
        '202': { description: '{ question: MicoAiMessage, answer: MicoAiMessage (pending) }' }
        '400': { description: 'Empty or too long, or AI_NOT_CONFIGURED (no chat model in AI Management)' }
        '404': { description: No such chat, or not yours }
        '409': { description: 'MICO_AI_BUSY: an answer is still being written in this chat' }
        '429': { description: 'AI_RATE_LIMITED: too many questions this minute, or the daily limit is reached' }
  /mico-ai/chats/{chatId}/messages/{messageId}:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: string } }
      - { name: messageId, in: path, required: true, schema: { type: string } }
    get:
      summary: One message (poll a pending answer until it is done, error or stopped).
      responses: { '200': { description: MicoAiMessage }, '404': { description: No such message in a chat of yours } }
  /mico-ai/chats/{chatId}/messages/{messageId}/stop:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: string } }
      - { name: messageId, in: path, required: true, schema: { type: string } }
    post:
      summary: Stop an answer being written (the AI call in flight is aborted; nothing it says later is kept).
      responses: { '200': { description: 'The MicoAiMessage, stopped' }, '404': { description: No such message in a chat of yours } }
  /mico-ai/chats/{chatId}/messages/{messageId}/confirm:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: string } }
      - { name: messageId, in: path, required: true, schema: { type: string } }
    post:
      summary: >-
        Confirm an answer's card of proposed changes (answer.kind "proposal"). The card stored with the
        answer is carried out, with only the person's ticks and edits on top (each checked again: their
        access, the project's people, real dates, and whether a task or the minutes changed since it was
        proposed). Each change is made through the app's own services as the person, marked "via MICO AI"
        in its history, with an audit entry (mico-ai.task.create, mico-ai.task.update,
        mico-ai.meeting.create, mico-ai.minutes.draft) and the usual notifications. A refused or failed
        change never stops the others. A change with needs (a part that couldn't be read, or that the checks
        refused, each tagged with the fields that fix it) is refused until an edit to one of those fields
        comes with Confirm — never made in part. Only the first confirm moves the card on: a repeat (a
        double click, a retry) returns the card as it is and changes nothing. Undo then stays open for 15
        minutes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  maxItems: 60
                  items:
                    type: object
                    required: [id, include]
                    properties:
                      id: { type: string, description: The change on the card (c1, c2 …) }
                      include: { type: boolean, description: Ticked }
                      edits: { type: object, description: 'The person''s edits to its fields (ids and values: projectId, assigneeIds, due, priority, columnId, title, date, time, minutes, attendeeIds, agenda, description, content)' }
                sendInvites: { type: boolean, description: 'The card''s "Email the invitations" tick box (on by default)' }
      responses:
        '200': { description: 'The MicoAiMessage, its answer.proposal with each change''s result (done, refused, failed or skipped, with why)' }
        '400': { description: The body is not in the expected form }
        '404': { description: No such answer with a card in a chat of yours }
  /mico-ai/chats/{chatId}/messages/{messageId}/cancel:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: string } }
      - { name: messageId, in: path, required: true, schema: { type: string } }
    post:
      summary: Cancel a card that hasn't been confirmed (nothing is changed). A card already confirmed is returned as it is.
      responses: { '200': { description: 'The MicoAiMessage, its card cancelled' }, '404': { description: No such answer with a card in a chat of yours } }
  /mico-ai/chats/{chatId}/messages/{messageId}/undo:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: string } }
      - { name: messageId, in: path, required: true, schema: { type: string } }
    post:
      summary: >-
        Undo a confirmed card, up to 15 minutes after confirming: newest first, each change is put back
        (a new task deleted, a task's fields and people restored, a new meeting cancelled — the people
        invited are told — or deleted when nobody was invited, the earlier draft of the minutes restored)
        unless someone changed it since; then it says so for that change and leaves it. A repeat changes
        nothing more. Audit action mico-ai.undo.
      responses:
        '200': { description: 'The MicoAiMessage, its card undone with each change''s outcome' }
        '404': { description: No such answer with a card in a chat of yours }
        '409': { description: 'UNDO_EXPIRED: more than 15 minutes since confirming; NOTHING_TO_UNDO: not confirmed, or nothing was made' }
  /mico-ai/chats/{chatId}/messages/{messageId}/tables/{n}.xlsx:
    parameters:
      - { name: chatId, in: path, required: true, schema: { type: string } }
      - { name: messageId, in: path, required: true, schema: { type: string } }
      - { name: n, in: path, required: true, schema: { type: integer, minimum: 1 }, description: The answer's table (1 = the first) }
    get:
      summary: >-
        An answer's table as an Excel workbook; /tables/{n}.pdf gives a branded PDF (company header, the
        question, the answer, the table). Built from the rows stored with the answer, so the figures are
        exactly the ones shown. The chat's owner only.
      responses:
        '200': { description: 'File download, e.g. mico-ai-overdue-tasks-2026-10-24.xlsx' }
        '404': { description: No such table, or not your chat }
  /meetings/{id}/notes/{noteId}/restore:
    post:
      summary: Undo a meeting-note delete (notes are soft-deleted). The note's author or the meeting's organizer only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: noteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The restored note }
        '403': { description: Not the author or organizer }
        '404': { description: No deleted note with that id in this meeting }
