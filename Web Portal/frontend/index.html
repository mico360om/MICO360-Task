<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8B1E1E" />
    <meta name="description" content="MICO360 Tasks — modern project & task management for teams." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>MICO360 Tasks</title>
    <style>
      /* Branded first-paint loading screen (replaced when the app mounts). */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(1100px 480px at 100% -8%, rgba(168, 51, 38, 0.08), transparent 60%),
          #f4f2f0;
      }
      #app-splash svg {
        width: 64px;
        height: 64px;
        animation: splash-pulse 1.4s ease-in-out infinite;
        filter: drop-shadow(0 10px 24px rgba(139, 30, 30, 0.28));
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.72; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-label="Loading MICO360 Tasks" role="status">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="sp-t" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#C7513F" />
              <stop offset="0.55" stop-color="#8B1E1E" />
              <stop offset="1" stop-color="#5E1414" />
            </linearGradient>
          </defs>
          <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#sp-t)" />
          <circle cx="15.5" cy="24.5" r="2.6" fill="#ffffff" />
          <path d="M15.5 24.5 L22 31 L33 18" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
