<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#8B1E1E" />
    <meta name="description" content="MICO360 Tasks — modern project & task management for teams." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iPhone and iPad: the home-screen icon (a PNG; iOS ignores an SVG), its name and the status bar
         once added to the home screen. The manifest is linked by the page itself, on staff pages only
         (src/lib/manifest-link.ts): a client's page never offers to install. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MICO360" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>MICO360 Tasks</title>
    <style>
      /* Branded first-paint loading screen (replaced when the app mounts). */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(1100px 480px at 100% -8%, rgba(168, 51, 38, 0.08), transparent 60%),
          #f4f2f0;
      }
      #app-splash img {
        width: 205px;
        height: auto;
        max-width: 60vw;
        animation: splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.72; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-label="Loading MICO360 Tasks" role="status">
        <img src="/brand/logo.png" alt="" width="205" height="96" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
