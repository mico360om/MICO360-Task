<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8B1E1E" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>You’re offline · MICO360 Tasks</title>
    <!-- Shown by the service worker (sw.js) for a page load with no signal when no page was kept on
         this device. No script (the site's security policy allows only its own files) and no data. -->
    <style>
      :root {
        --ground: #f4f2f0;
        --surface: #ffffff;
        --ink: #1f1a17;
        --ink-2: #5b524c;
        --line: #e6e0db;
        --brand: #8b1e1e;
        --brand-ink: #ffffff;
        --note: #f7efe9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #151212;
          --surface: #1f1b1a;
          --ink: #f3eeea;
          --ink-2: #bdb3ac;
          --line: #352f2c;
          --brand: #c7513f;
          --brand-ink: #ffffff;
          --note: #2a2321;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        background: var(--ground);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
        text-align: center;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      }
      svg { width: 56px; height: 56px; }
      h1 { margin: 16px 0 6px; font-size: 1.375rem; line-height: 1.3; }
      p { margin: 0; color: var(--ink-2); }
      .try {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 20px;
        padding: 0 22px;
        border-radius: 12px;
        background: var(--brand);
        color: var(--brand-ink);
        font-weight: 600;
        text-decoration: none;
      }
      .try:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      .note {
        margin-top: 20px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--note);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MICO360 Tasks">
        <defs>
          <linearGradient id="t" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#C7513F" />
            <stop offset="0.55" stop-color="#8B1E1E" />
            <stop offset="1" stop-color="#5E1414" />
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#t)" />
        <circle cx="15.5" cy="24.5" r="2.6" fill="#ffffff" />
        <path d="M15.5 24.5 L22 31 L33 18" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>You’re offline</h1>
      <p>This page needs a connection.</p>
      <a class="try" href="">Try again</a>
      <p class="note">Inspections you already opened keep working offline. Your changes are sent when you’re back online.</p>
    </main>
  </body>
</html>
