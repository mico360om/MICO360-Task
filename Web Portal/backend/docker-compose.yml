services:
  mysql:
    image: mysql:8.0
    container_name: mico360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mico360
      MYSQL_USER: mico
      MYSQL_PASSWORD: mico
    ports:
      - "3306:3306"
    volumes:
      - mico360_mysql:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mico360_mysql:
